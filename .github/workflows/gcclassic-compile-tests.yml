#
# GitHub Actions configuration file to perform "compile-only"
# integration tests for GEOS-Chem Classic that are triggered by
# push or pull requests.
#
name: gcclassic-compile-tests

on: [pull_request, push]

# Cancel running jobs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gnu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug]
        gcc-version: [10, 11, 12, 13, 14, 15, 16]
    env:
      CXX: g++
      CC: gcc
      FC: gfortran

    name: Compile-only tests (${{ matrix.build_type }}, GCC ${{ matrix.gcc-version }})
    steps:
      - name: Checkout code
        with:
          persist-credentials: false
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ | xargs -r sudo rm -f
          sudo apt update -y
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update -y
          sudo apt install -y gcc-${{ matrix.gcc-version }} g++-${{ matrix.gcc-version }} gfortran-${{ matrix.gcc-version }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.gcc-version }} 100 \
             --slave /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.gcc-version }} \
             --slave /usr/bin/gfortran gfortran /usr/bin/gfortran-${{ matrix.gcc-version }}
          sudo apt install -y libnetcdf-dev netcdf-bin libnetcdff-dev ripgrep python3-h5py python3-numpy

      - name: Verify environment
        run: |
          gcc --version
          g++ --version
          gfortran --version

      - name: BrC implementation checks
        run: |
          git submodule update --init --recursive
          /usr/bin/python3 scripts/check_brc_submodule_contract.py --repo .
          /usr/bin/python3 -m unittest discover -s scripts -p 'test_*.py' -v
          cd src/GEOS-Chem
          bash test/implementation/run_brc_aerosol_map_test.sh
          bash test/implementation/run_brc_cloudj_map_test.sh
          bash test/implementation/run_brc_optics_math_test.sh
          bash test/implementation/run_brc_species_test.sh
          bash test/implementation/brc_wiring_test.sh
          bash test/implementation/brc_finnv25_config_test.sh
          bash test/implementation/qfed_brc_wiring_test.sh
          python3 test/implementation/brc_bioburn_diagn_test.py

      - name: Fire emission and injection numerical tests
        run: |
          cmake -S src/HEMCO -B build_hemco_units -DBUILD_TESTING=ON -DHEMCO_EXTERNAL_CONFIG=OFF
          cmake --build build_hemco_units --target hcox_gfed_scaling_test -j2
          ctest --test-dir build_hemco_units --output-on-failure -R '^hcox_gfed_(scaling|scaling_integration)$'

      - name: Compile-only tests
        run: |
          cd test/integration/GCClassic
          ./integrationTest.sh -d $HOME/compile-tests -t compile
          cat $HOME/compile-tests/logs/results.compile.log
